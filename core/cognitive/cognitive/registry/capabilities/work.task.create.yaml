# Capability: work.task.create
# Track P1 — Work Management

id: "work.task.create"
version: "1.0.0"
domain: "work_management"
description: >
  Cria uma Task no Supabase (status inicial 'todo'). Opcionalmente vincula a
  Projects (project_ids, o primeiro vira is_primary) e Ideas (idea_ids), e
  declara uma dependência (depends_on_task_id). Enfileira sync outbox para
  o card espelho na lista "A Fazer" do Trello.
adapter: "work_management"
default_policy: "allow"

required_scopes:
  - "work:write"

input_schema:
  type: object
  required:
    - title
  properties:
    title:
      type: string
    description:
      type: string
    priority:
      type: string
      enum: ["low", "medium", "high", "urgent"]
    assignee:
      type: string
    due_at:
      type: string
      description: "ISO datetime."
    source:
      type: string
    project_ids:
      type: array
      items:
        type: string
    idea_ids:
      type: array
      items:
        type: string
    depends_on_task_id:
      type: string
      description: "Task bloqueadora — esta task fica dependente dela."

output_schema:
  type: object
  properties:
    id:
      type: string
    status:
      type: string
    project_ids:
      type: array
    idea_ids:
      type: array

tools: []

idempotency_behavior: "return_cached"
timeout_seconds: 15
cost_class: "low"

audit_rules:
  log_inputs: true
  log_outputs: true

redaction_rules:
  - "api_key"
  - "password"
  - "token"
  - "secret"
