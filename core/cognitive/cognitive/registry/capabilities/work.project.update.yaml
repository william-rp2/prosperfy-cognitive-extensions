# Capability: work.project.update
# Track P1 — Work Management
#
# Patch parcial. status='archived' seta archived_at automaticamente.

id: "work.project.update"
version: "1.0.0"
domain: "work_management"
description: "Atualiza campos de um Project existente (patch parcial) e/ou muda seu status."
adapter: "work_management"
default_policy: "allow"

required_scopes:
  - "work:write"

input_schema:
  type: object
  required:
    - project_id
  properties:
    project_id:
      type: string
    title:
      type: string
    description:
      type: string
    status:
      type: string
      enum: ["planned", "active", "on_hold", "completed", "cancelled", "archived"]
    priority:
      type: string
      enum: ["low", "medium", "high", "urgent"]
    owner:
      type: string
    start_date:
      type: string
    due_date:
      type: string
    tags:
      type: array
      items:
        type: string

output_schema:
  type: object
  properties:
    id:
      type: string
    status:
      type: string

tools: []

idempotency_behavior: "return_cached"
timeout_seconds: 15
cost_class: "low"

audit_rules:
  log_inputs: true
  log_outputs: true

redaction_rules:
  - "api_key"
  - "password"
  - "token"
  - "secret"
