# Capability: finance.budget.read
# P2 — Financeiro pelo WhatsApp.

id: "finance.budget.read"
version: "1.0.0"
domain: "finance"
description: >
  Consulta orçamento(s) de um mês — geral e/ou por categoria — com
  limite, gasto e saldo sempre calculados a partir do razão (nunca
  armazenados).
adapter: "finance_api"
default_policy: "allow"

required_scopes:
  - "finance:read"

input_schema:
  type: object
  properties:
    month:
      type: string
      description: "Mês no formato YYYY-MM. Default: mês corrente."

output_schema:
  type: object
  properties:
    month:
      type: string
    budgets:
      type: array

tools: []

idempotency_behavior: "return_cached"
timeout_seconds: 15
cost_class: "low"

audit_rules:
  log_inputs: true
  log_outputs: true

redaction_rules:
  - "api_key"
  - "password"
  - "token"
  - "secret"
