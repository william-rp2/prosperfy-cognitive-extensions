# Capability: finance.bills.read
# P2 — Financeiro pelo WhatsApp.
#
# Faturas de cartão de crédito. Lista vazia é resposta válida (sem faturas
# sincronizadas ainda, ou conector sem produto de cartão) — nunca um erro.

id: "finance.bills.read"
version: "1.0.0"
domain: "finance"
description: >
  Lista faturas de cartão de crédito a vencer (ou todas, se fromDate
  omitido), ordenadas pela data de vencimento mais próxima.
adapter: "finance_api"
default_policy: "allow"

required_scopes:
  - "finance:read"

input_schema:
  type: object
  properties:
    fromDate:
      type: string
      description: "Só faturas com vencimento a partir desta data. Default: hoje."
    limit:
      type: integer
      minimum: 1
      maximum: 200

output_schema:
  type: object
  properties:
    bills:
      type: array

tools: []

idempotency_behavior: "return_cached"
timeout_seconds: 15
cost_class: "low"

audit_rules:
  log_inputs: true
  log_outputs: true

redaction_rules:
  - "api_key"
  - "password"
  - "token"
  - "secret"
