# Capability: infra.action
# Phase 1B — Infra Actions V1 (Slice 1H). RESTART CONTAINER ONLY.
#
# ADR-V2-004: default_policy = deny (WRITE/destrutivo). Grant explícito obrigatório.
# ADR-V2-002: params.resource é lógico ("prosperfy-vps-homolog") — nunca IP/host.
# Enforcement restart-only: execution/orchestrator.py (gate-0.3).

id: "infra.action"
version: "1.0.0"
domain: "infrastructure"
description: >
  Executa ações governadas de infraestrutura em um resource lógico tenant-scoped.
  Slice 1: restart de container via prosperfy_vps_controlar_container.
adapter: "prosperfy_skills"
default_policy: "deny"

required_scopes:
  - "infra:write"

input_schema:
  type: object
  required:
    - resource
    - action
    - target_type
    - target
  properties:
    resource:
      type: string
      description: "Resource lógico tenant-scoped (ex: 'prosperfy-vps-homolog'). Nunca IP/host."
    action:
      type: string
      enum:
        - "restart"
    target_type:
      type: string
      const: "container"
    target:
      type: string
      description: "Nome do container (ex.: omniroute)."

output_schema:
  type: object
  properties:
    success:
      type: boolean
    execution_result:
      type: object

tools:
  - name: "prosperfy_vps_controlar_container"
    args_from_resource: true
    required: true

idempotency_behavior: "return_cached"
timeout_seconds: 60
cost_class: "low"

audit_rules:
  log_inputs: true
  log_outputs: true

redaction_rules:
  - "api_key"
  - "password"
  - "token"
  - "secret"
