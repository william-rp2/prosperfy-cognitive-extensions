# Capability: work.idea.get
# Track P1 — Work Management

id: "work.idea.get"
version: "1.0.0"
domain: "work_management"
description: "Busca uma Idea por id, incluindo os project_ids vinculados."
adapter: "work_management"
default_policy: "allow"

required_scopes:
  - "work:read"

input_schema:
  type: object
  required:
    - idea_id
  properties:
    idea_id:
      type: string

output_schema:
  type: object
  properties:
    id:
      type: string
    title:
      type: string
    status:
      type: string
    project_ids:
      type: array

tools: []

idempotency_behavior: "none"
timeout_seconds: 15
cost_class: "low"

audit_rules:
  log_inputs: true
  log_outputs: false

redaction_rules:
  - "api_key"
  - "password"
  - "token"
  - "secret"
